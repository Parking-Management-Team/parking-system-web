<script>
        // Simple toggle logic for custom styling if needed, though mostly handled by Tailwind classes in a real implementation
        const toggleInput = document.getElementById('activeStatus');
        toggleInput.addEventListener('change', function() {
            if(this.checked) {
                this.classList.replace('translate-x-0', 'translate-x-6');
                this.classList.replace('border-secondary', 'border-primary');
            } else {
                this.classList.replace('translate-x-6', 'translate-x-0');
                this.classList.replace('border-primary', 'border-secondary');
            }
        });
